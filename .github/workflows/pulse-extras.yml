name: Update Pulse Extras (holders + baseline)

on:
  workflow_dispatch:
  schedule:
    # Daily (UTC). Keeps /public/data/pulse-extras.json fresh.
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build pulse-extras.json
        run: node ./scripts/update-pulse-extras.mjs

      - name: Commit changes (if any)
        run: |
          if git diff --quiet; then
            echo "No changes";
            exit 0;
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/pulse-extras.json
          git commit -m "chore: update pulse extras"
          git push
